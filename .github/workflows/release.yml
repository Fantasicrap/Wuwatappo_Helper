name: Verify and publish release

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: GitHub draft release ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify checksums and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          ./scripts/publish-release.ps1 -Repository $env:GITHUB_REPOSITORY -ReleaseId $env:RELEASE_ID -Commit $env:GITHUB_SHA
